<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>semana2 — Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card shadow-sm w-100" style="max-width: 420px;">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-3">semana2</h1>
        <p class="text-muted text-center mb-4">Inicia sesión con tus credenciales</p>

        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" id="username" class="form-control" placeholder="tu.correo@dominio.cl" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button class="btn btn-primary w-100" type="submit">Ingresar</button>
        </form>

        <div id="errorBox" class="alert alert-danger mt-3 d-none" role="alert">
          Credenciales inválidas. Inténtalo nuevamente.
        </div>

        <div class="text-center mt-3">
          <small class="text-muted">¿Olvidaste tu contraseña? Contacta al administrador.</small>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Decodifica el payload del JWT para leer el "role"
    function parseJwt (token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const errorBox = document.getElementById('errorBox');
      errorBox.classList.add('d-none');

      try {
        const resp = await fetch('/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, password })
        });

        if (!resp.ok) {
          errorBox.classList.remove('d-none');
          return;
        }

        const data = await resp.json(); // { accessToken: "..." }
        const token = data.accessToken;
        // Guarda el token para futuras llamadas
        localStorage.setItem('token', token);

        // Lee el rol desde el claim "role" del JWT
        const payload = parseJwt(token);
        const role = payload && payload.role ? payload.role : null;

        // Redirige según el rol
        if (role === 'ROLE_ADMIN') {
          window.location.href = '/admin';
        } else if (role === 'ROLE_USER') {
          window.location.href = '/user';
        } else {
          // rol desconocido: manda a home user por defecto
          window.location.href = '/user';
        }
      } catch (err) {
        console.error(err);
        errorBox.classList.remove('d-none');
      }
    });
  </script>
</body>


    <footer>
        <p>&copy; 2024 RecetApp - Todos los derechos reservados</p>
    </footer>
</body>
</html>
