<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Panel Administrador — semana2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h3 mb-3">Panel Administrador</h1>
    <p class="text-muted">Bienvenido/a. Tu rol es <strong>ROLE_ADMIN</strong>.</p>
  </div>

  <button class="btn btn-outline-secondary" onclick="logout()">Cerrar sesión</button>
<script>
async function logout() {
  await fetch('/auth/logout', { method: 'POST' });
  window.location.href = '/';
}
</script>

</body>
</html>
