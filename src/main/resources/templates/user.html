<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head>
  <meta charset="utf-8">
  <title>Inicio Usuario — semana2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div sec:authorize="hasRole('USER')">
      <h1 class="h3 mb-3">Inicio Usuario</h1>
      <p class="text-muted">Bienvenido/a. Tu rol es <strong>ROLE_USER</strong>.</p>
    </div>
  </div>
  <form th:action="@{/logout}" method="post" style="display: inline;">
      <button class="btn btn-outline-secondary" type="submit">Cerrar sesión</button>
  </form>
</body>
</html>
